<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>线下预约 · 中国瑜伽网</title>
  <meta name="description" content="预约深圳梧桐山慈禅甘露堂线下体验：赤脚班、熏蒸康养、小动作养生班、经络学习、共修活动。中国瑜伽网康养联盟线下基地。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <section class="banner">
    <div class="wrap">
      <p class="crumb"><a href="index.html">首页</a> / 线下预约</p>
      <h1>线下预约</h1>
      <p>欢迎各地同道前来梧桐山爬山、赤脚行、共修交流。填写预约信息，基地守护人将与您确认到访时间。地址：深圳梧桐山坑背村129-1 · 慈禅甘露堂。</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="grid grid-2" style="align-items:start">
        <div class="reveal">
          <span class="eyebrow">可预约项目 · BOOK</span>
          <h2>选择你的体验</h2>
          <div class="grid grid-2" style="gap:14px;margin-top:10px">
            <div class="card" style="padding:18px"><div class="ic">🦶</div><h3 style="font-size:16px">赤脚养生班</h3><p class="note" style="font-size:14px">赤脚走泥地、抱树等自然体验。</p></div>
            <div class="card" style="padding:18px"><div class="ic">♨</div><h3 style="font-size:16px">熏蒸康养</h3><p class="note" style="font-size:14px">古法熏蒸放松与日常养护。</p></div>
            <div class="card" style="padding:18px"><div class="ic">📜</div><h3 style="font-size:16px">小动作养生班</h3><p class="note" style="font-size:14px">八卦步、穴位拍打小班教学。</p></div>
            <div class="card" style="padding:18px"><div class="ic">🕯</div><h3 style="font-size:16px">共修 / 共读</h3><p class="note" style="font-size:14px">《了凡四训》共读、日行一善共修。</p></div>
          </div>
          <div class="callout reveal" style="margin-top:18px">
            <h4>到访提示</h4>
            <p>基地为文化康养场所，体验以放松与日常养护为主，非医疗诊疗。请穿着舒适衣物，赤脚项目请视地面安全与个人情况参与。</p>
          </div>
        </div>

        <form class="card reveal" data-demo>
          <h3>预约登记</h3>
          <div class="form-grid">
            <div class="field"><label>姓名</label><input type="text" placeholder="称呼" required></div>
            <div class="field"><label>手机 / 微信</label><input type="text" placeholder="便于联系" required></div>
            <div class="field"><label>预约项目</label>
              <select>
                <option>赤脚养生班</option>
                <option>熏蒸康养</option>
                <option>小动作养生班</option>
                <option>共修 / 共读</option>
                <option>多项 / 待建议</option>
              </select>
            </div>
            <div class="field"><label>期望到访日期</label><input type="date"></div>
            <div class="field full"><label>人数 / 备注</label>
              <textarea placeholder="同行人数、特殊需求或想了解的内容"></textarea>
            </div>
          </div>
          <div class="hero-actions" style="margin-top:18px">
            <button class="btn btn-primary" type="submit">提交预约</button>
          </div>
          <p class="form-result note" style="display:none;color:var(--jade-deep);margin-top:14px"></p>
        </form>
      </div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="assets/js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内容发布后台 · 中国瑜伽网</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .admin { max-width: 980px; margin: 0 auto; padding: 40px 16px 64px; }
    .admin-login { max-width: 360px; margin: 80px auto; text-align: center; }
    .admin-login input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; margin: 14px 0; }
    .admin-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .admin-head h2 { margin: 0; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
    .tab { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font-size: 14px; }
    .tab.active { background: var(--jade-deep); color: #fff; border-color: var(--jade-deep); }
    .admin-body { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 760px){ .admin-body { grid-template-columns: 1fr; } }
    .admin-list .item { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; background: #fff; }
    .admin-list .item h4 { margin: 0 0 4px; font-size: 16px; }
    .admin-list .item .meta { color: #8a8268; font-size: 12px; margin-bottom: 8px; }
    .admin-list .item .row { display: flex; gap: 8px; }
    .admin-form { border: 1px solid var(--line); border-radius: 12px; padding: 18px; background: #fff; align-self: start; }
    .admin-form h3 { margin-top: 0; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: var(--ink); margin-bottom: 6px; font-weight: 600; }
    .field input, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; }
    .field textarea { min-height: 110px; resize: vertical; }
    .form-actions { display: flex; gap: 10px; margin-top: 6px; }
    .form-result { color: var(--jade-deep); font-size: 14px; margin-top: 12px; display: none; }
    .note.tip { color:#8a8268; font-size:12px; margin-top:10px; }
    .field input[type="file"] { padding: 8px; font-size: 13px; background:#fff; }
    .media-preview { margin-top: 8px; }
    .media-preview img { max-width: 100%; max-height: 220px; border-radius: 10px; border: 1px solid var(--line); display:block; }
    .media-preview a { font-size: 13px; color: var(--jade-deep); }
    .field .hint { font-size: 12px; color:#8a8268; margin: 4px 0 0; }
  </style>
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="admin">
    <!-- 登录 -->
    <div id="login" class="admin-login">
      <h2>内容发布后台</h2>
      <p class="note">请输入管理密码（ADMIN_KEY）进入</p>
      <input id="key" type="password" placeholder="管理密码 ADMIN_KEY" autocomplete="current-password">
      <button class="btn btn-primary" id="loginBtn" style="width:100%">进入后台</button>
      <p class="note" id="loginMsg"></p>
    </div>

    <!-- 主界面 -->
    <div id="app" class="admin-app" style="display:none">
      <div class="admin-head">
        <h2>内容发布后台</h2>
        <div>
          <a class="btn btn-outline btn-sm" href="index.html">查看站点</a>
          <button class="btn btn-gold btn-sm" id="logout">退出</button>
        </div>
      </div>

      <div class="tabs" id="tabs"></div>

      <div class="admin-body">
        <div class="admin-list" id="list">
          <button class="btn btn-primary btn-sm" id="newBtn">+ 新建一条</button>
          <div id="listItems" style="margin-top:14px"></div>
        </div>

        <div class="admin-form" id="formPanel" style="display:none">
          <h3 id="formTitle">新建</h3>
          <form id="itemForm"></form>
          <div class="form-actions">
            <button class="btn btn-primary" id="saveBtn">保存发布</button>
            <button class="btn btn-outline" id="cancelBtn" type="button">取消</button>
          </div>
          <p class="form-result" id="formMsg"></p>
        </div>
      </div>
      <p class="note tip">提示：保存后会自动提交到代码仓库并触发站点重新部署，通常 1–2 分钟生效。本后台仅在部署到 Vercel 后可用；本地预览无法保存。</p>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="assets/js/main.js"></script>
  <script>
  (function () {
    "use strict";
    var TYPES = [
      { key: "essays",  label: "文化随笔" },
      { key: "cases",   label: "学员案例" },
      { key: "charity", label: "公益善行" },
      { key: "news",    label: "最新动态" },
      { key: "bookings", label: "预约登记" }
    ];
    var IS_BOOKING = function (t) { return t === "bookings"; };
    var SCHEMA = {
      essays:  [ {k:"title",l:"标题",r:1}, {k:"tag",l:"栏目标签(如 梧桐山·小记)"}, {k:"author",l:"作者/署名"}, {k:"date",l:"日期 YYYY-MM-DD"}, {k:"body",l:"正文(空行分段)",t:"textarea",r:1}, {k:"image",l:"封面图(可选)",t:"media",accept:"image/*"}, {k:"video",l:"视频网址(可选，仅粘贴外部链接)"} ],
      cases:   [ {k:"name",l:"姓名/称呼",r:1}, {k:"tag",l:"主题标签"}, {k:"icon",l:"图标 emoji"}, {k:"text",l:"分享内容",t:"textarea",r:1}, {k:"image",l:"照片(可选)",t:"media",accept:"image/*"}, {k:"video",l:"视频网址(可选，仅粘贴外部链接)"} ],
      charity: [ {k:"title",l:"标题",r:1}, {k:"date",l:"时间/年份(如 日常/常年)"}, {k:"body",l:"内容",t:"textarea",r:1}, {k:"image",l:"照片(可选)",t:"media",accept:"image/*"}, {k:"video",l:"视频网址(可选，仅粘贴外部链接)"} ],
      news:    [ {k:"title",l:"标题",r:1}, {k:"date",l:"日期 YYYY-MM-DD"}, {k:"content",l:"内容",t:"textarea",r:1}, {k:"image",l:"封面图(可选)",t:"media",accept:"image/*"}, {k:"video",l:"视频网址(可选，仅粘贴外部链接)"} ]
    };
    var KEY = "cy_admin_key";
    var state = { type: "essays", editingId: null };

    function key() { return sessionStorage.getItem(KEY) || ""; }
    function el(id) { return document.getElementById(id); }

    function renderTabs() {
      el("tabs").innerHTML = TYPES.map(function (t) {
        return '<span class="tab' + (t.key === state.type ? " active" : "") + '" data-t="' + t.key + '">' + t.label + "</span>";
      }).join("");
      Array.prototype.forEach.call(el("tabs").querySelectorAll(".tab"), function (tab) {
        tab.addEventListener("click", function () {
          state.type = tab.getAttribute("data-t");
          state.editingId = null;
          el("formPanel").style.display = "none";
          renderTabs();
          loadList();
        });
      });
    }

    function loadList() {
      var isBk = IS_BOOKING(state.type);
      el("newBtn").style.display = isBk ? "none" : "inline-block";

      if (isBk) {
        fetch("/api/booking?t=" + Date.now(), { headers: { "x-admin-key": key() } })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok) throw new Error(res.d.error || "加载失败");
            var items = Array.isArray(res.d.items) ? res.d.items : [];
            if (!items.length) { el("listItems").innerHTML = '<p class="note">暂无预约登记。访客在前台「线下预约」提交后会显示在这里。</p>'; return; }
            el("listItems").innerHTML = items.map(function (it) {
              var meta = [it.project, it.contact, it.date, it.createdAt ? it.createdAt.replace("T", " ").slice(0, 16) : ""].filter(Boolean).join(" ｜ ");
              return '<div class="item"><h4>' + esc(it.name || "(无名)") + "</h4>" +
                (meta ? '<div class="meta">' + esc(meta) + "</div>" : "") +
                (it.note ? '<p class="note" style="font-size:13px;margin:6px 0 10px">' + esc(it.note) + "</p>" : "") +
                '<div class="row"><button class="btn btn-outline btn-sm" data-del="' + esc(it.id) + '">已处理/删除</button></div></div>';
            }).join("");
            Array.prototype.forEach.call(el("listItems").querySelectorAll("[data-del]"), function (b) {
              b.addEventListener("click", function () { del(b.getAttribute("data-del")); });
            });
          })
          .catch(function (e) { el("listItems").innerHTML = '<p class="note">加载失败：' + esc(e.message) + "</p>"; });
        return;
      }

      fetch("content/" + state.type + ".json", { cache: "no-cache" })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (data) {
          data = Array.isArray(data) ? data : [];
          if (!data.length) { el("listItems").innerHTML = '<p class="note">暂无内容，点「新建」发布第一条。</p>'; return; }
          el("listItems").innerHTML = data.map(function (it) {
            var title = it.title || it.name || "(未命名)";
            var meta = [it.date, it.tag, it.author].filter(Boolean).join(" · ");
            return '<div class="item"><h4>' + esc(title) + "</h4>" +
              (meta ? '<div class="meta">' + esc(meta) + "</div>" : "") +
              '<div class="row"><button class="btn btn-outline btn-sm" data-edit="' + esc(it.id) + '">编辑</button>' +
              '<button class="btn btn-outline btn-sm" data-del="' + esc(it.id) + '">删除</button></div></div>';
          }).join("");
          Array.prototype.forEach.call(el("listItems").querySelectorAll("[data-edit]"), function (b) {
            b.addEventListener("click", function () { openForm(b.getAttribute("data-edit")); });
          });
          Array.prototype.forEach.call(el("listItems").querySelectorAll("[data-del]"), function (b) {
            b.addEventListener("click", function () { del(b.getAttribute("data-del")); });
          });
        })
        .catch(function () { el("listItems").innerHTML = '<p class="note">列表加载失败。</p>'; });
    }

    function openForm(id) {
      state.editingId = id || null;
      el("formTitle").textContent = id ? "编辑" : "新建";
      el("formMsg").style.display = "none";
      var fields = SCHEMA[state.type];
      fetch("content/" + state.type + ".json", { cache: "no-cache" })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (data) {
          var cur = id ? (data.filter(function (x) { return x.id === id; })[0] || {}) : {};
          el("itemForm").innerHTML = fields.map(function (f) {
            var val = cur[f.k] != null ? cur[f.k] : "";
            if (f.t === "media") {
              return '<div class="field"><label>' + esc(f.l) + "</label>" +
                '<input type="file" accept="' + (f.accept || "") + '" data-media="' + f.k + '">' +
                '<p class="hint">选择图片后将自动压缩并上传（建议原图≤4MB，系统会压到 1MB 内）；也可在下方直接粘贴外部图片网址。</p>' +
                '<div class="media-preview" id="prev-' + f.k + '">' + previewHtml(f.k, val) + "</div>" +
                '<input type="text" name="' + f.k + '" value="' + esc(val) + '" placeholder="上传后自动填入，也可直接粘贴图片网址">' +
                (val ? '<button type="button" class="btn btn-outline btn-sm" data-clear="' + f.k + '">移除</button>' : "") +
                "</div>";
            }
            return '<div class="field"><label>' + esc(f.l) + (f.r ? " *" : "") + "</label>" +
              (f.t === "textarea"
                ? '<textarea name="' + f.k + '">' + esc(val) + "</textarea>"
                : '<input name="' + f.k + '" value="' + esc(val) + '">') + "</div>";
          }).join("");
          // 绑定媒体上传与移除
          Array.prototype.forEach.call(el("itemForm").querySelectorAll("[data-media]"), function (inp) {
            inp.addEventListener("change", function () {
              var field = inp.getAttribute("data-media");
              var file = inp.files && inp.files[0];
              if (!file) return;
              uploadImage(field, file);
            });
          });
          bindClearButtons();
          el("formPanel").style.display = "block";
        });
    }

    function previewHtml(field, url) {
      if (!url) return "";
      return '<img src="' + esc(url) + '" alt="预览">';
    }

    function bindClearButtons() {
      Array.prototype.forEach.call(el("itemForm").querySelectorAll("[data-clear]"), function (b) {
        b.addEventListener("click", function () {
          var field = b.getAttribute("data-clear");
          var hidden = el("itemForm").querySelector('[name="' + field + '"]');
          if (hidden) hidden.value = "";
          var prev = el("prev-" + field);
          if (prev) prev.innerHTML = "";
          b.remove();
        });
      });
    }

    function uploadImage(field, file) {
      var prev = el("prev-" + field);
      var hidden = el("itemForm").querySelector('[name="' + field + '"]');
      if (file.size > 8 * 1024 * 1024) {
        alert("图片原始文件过大（>8MB），请先压缩或换一张较小的图。");
        return;
      }
      prev.innerHTML = "⏳ 压缩并上传中…";
      compressImage(file, 1280, 0.82)
        .then(function (blob) { return blobToBase64(blob); })
        .then(function (b64) {
          // 解码后字节数约为 base64 长度的 3/4，超出 1MB 时提示换图
          if (Math.floor(b64.length * 3 / 4) > 1000 * 1024) {
            throw new Error("压缩后图片仍偏大，请换一张更小的图");
          }
          return fetch("/api/upload", {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-admin-key": key() },
            body: JSON.stringify({ filename: file.name || "image.jpg", content: b64 }),
          }).then(function (r) {
            return r.json().then(function (d) {
              if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
              return d;
            });
          });
        })
        .then(function (d) {
          hidden.value = d.url;
          prev.innerHTML = previewHtml(field, d.url) +
            ' <button type="button" class="btn btn-outline btn-sm" data-clear="' + field + '">移除</button>';
          bindClearButtons();
        })
        .catch(function (e) {
          var msg = (e && e.message) ? e.message : "上传失败";
          if (/Failed to fetch|network/i.test(msg)) {
            msg = "网络异常，上传未成功。可改用「直接粘贴外部图片网址」的方式。";
          }
          prev.innerHTML = "✗ " + msg;
        });
    }

    // 用 canvas 把图片缩放到最大边 maxDim、并以 JPEG 质量 quality 压缩（控制体积，便于写入仓库）
    function compressImage(file, maxDim, quality) {
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () {
          URL.revokeObjectURL(url);
          var w = img.naturalWidth, h = img.naturalHeight;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, cw, ch);
          canvas.toBlob(function (blob) {
            if (!blob) return reject(new Error("图片压缩失败"));
            resolve(blob);
          }, "image/jpeg", quality);
        };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("无法读取该图片")); };
        img.src = url;
      });
    }

    function blobToBase64(blob) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () { resolve((reader.result || "").split(",")[1] || ""); };
        reader.onerror = function () { reject(new Error("读取图片失败")); };
        reader.readAsDataURL(blob);
      });
    }

    function save() {
      var fields = SCHEMA[state.type];
      var item = {};
      fields.forEach(function (f) {
        var node = el("itemForm").querySelector('[name="' + f.k + '"]');
        item[f.k] = node ? node.value.trim() : "";
        if (f.r && !item[f.k]) { alert("请填写：" + f.l); throw new Error("missing " + f.k); }
      });
      item.id = state.editingId || (state.type + "-" + Date.now().toString(36));

      var msg = el("formMsg");
      msg.style.display = "none";
      el("saveBtn").disabled = true;
      api("POST", state.type, { item: item })
        .then(function () {
          msg.textContent = "✓ 已保存并触发重新部署，稍后刷新站点即可看到。";
          msg.style.display = "block";
          state.editingId = null;
          el("formPanel").style.display = "none";
          loadList();
        })
        .catch(function (e) {
          msg.textContent = "✗ 保存失败：" + (e && e.message ? e.message : "请确认已部署到 Vercel 并配置环境变量");
          msg.style.display = "block";
        })
        .then(function () { el("saveBtn").disabled = false; });
    }

    function del(id) {
      if (!confirm(IS_BOOKING(state.type) ? "确定删除这条预约登记？" : "确定删除这条内容？")) return;
      if (IS_BOOKING(state.type)) {
        fetch("/api/booking?id=" + encodeURIComponent(id), { method: "DELETE", headers: { "x-admin-key": key() } })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) { if (!res.ok) throw new Error(res.d.error || "删除失败"); loadList(); })
          .catch(function (e) { alert("删除失败：" + (e.message || "未知错误")); });
        return;
      }
      api("DELETE", state.type, { id: id })
        .then(function () { loadList(); })
        .catch(function (e) { alert("删除失败：" + (e && e.message ? e.message : "未知错误")); });
    }

    function api(method, type, body) {
      return fetch("/api/content?type=" + encodeURIComponent(type), {
        method: method,
        headers: { "Content-Type": "application/json", "x-admin-key": key() },
        body: JSON.stringify(body)
      }).then(function (r) {
        if (!r.ok) { return r.json().catch(function(){return {};}).then(function(d){ throw new Error(d.error || ("HTTP " + r.status)); }); }
        return r.json();
      });
    }

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function enter() {
      var k = el("key").value.trim();
      if (!k) { el("loginMsg").textContent = "请输入管理密码"; return; }
      sessionStorage.setItem(KEY, k);
      el("login").style.display = "none";
      el("app").style.display = "block";
      renderTabs();
      loadList();
    }

    el("loginBtn").addEventListener("click", enter);
    el("key").addEventListener("keydown", function (e) { if (e.key === "Enter") enter(); });
    el("logout").addEventListener("click", function () { sessionStorage.removeItem(KEY); location.reload(); });
    el("newBtn").addEventListener("click", function () { openForm(null); });
    el("saveBtn").addEventListener("click", function () { try { save(); } catch (e) {} });
    el("cancelBtn").addEventListener("click", function () { state.editingId = null; el("formPanel").style.display = "none"; });

    // 若已登录则直接进入
    if (key()) { el("login").style.display = "none"; el("app").style.display = "block"; renderTabs(); loadList(); }
  })();
  </script>
</body>
</html>

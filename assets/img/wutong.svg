<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="梧桐山慈禅甘露堂意境图">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0d4"/>
      <stop offset="1" stop-color="#eef0e2"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f8d7c"/>
      <stop offset="1" stop-color="#2c5246"/>
    </linearGradient>
    <linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ba892"/>
      <stop offset="1" stop-color="#3a6b5c"/>
    </linearGradient>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4b3c"/>
      <stop offset="1" stop-color="#6e3a2e"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#sky)"/>

  <!-- 远山 -->
  <path d="M0 200 Q120 120 240 180 T480 160 T600 190 L600 400 L0 400 Z" fill="url(#mtn2)" opacity="0.55"/>
  <!-- 主峰 -->
  <path d="M0 250 Q140 150 300 230 Q460 150 600 240 L600 400 L0 400 Z" fill="url(#mtn)"/>
  <!-- 云雾 -->
  <path d="M40 170 Q120 150 200 172 Q150 188 60 184 Z" fill="#ffffff" opacity="0.4"/>
  <path d="M360 150 Q450 132 540 158 Q470 176 380 170 Z" fill="#ffffff" opacity="0.35"/>

  <!-- 林木点缀 -->
  <g fill="#244038" opacity="0.6">
    <path d="M120 300 l8 -34 l8 34 z"/><path d="M150 308 l7 -28 l7 28 z"/>
    <path d="M470 300 l8 -32 l8 32 z"/><path d="M500 308 l6 -24 l6 24 z"/>
  </g>

  <!-- 殿堂（慈禅甘露堂） -->
  <g transform="translate(250 250)">
    <rect x="0" y="40" width="100" height="70" fill="url(#hall)"/>
    <polygon points="-12,40 50,8 112,40" fill="#5c3329"/>
    <rect x="14" y="62" width="22" height="48" fill="#3a2018"/>
    <rect x="64" y="62" width="22" height="48" fill="#3a2018"/>
    <rect x="44" y="62" width="12" height="48" fill="#caa15a"/>
    <rect x="6" y="30" width="88" height="12" fill="#caa15a" opacity="0.9"/>
  </g>

  <!-- 牌匾 -->
  <g transform="translate(258 232)">
    <rect x="0" y="0" width="84" height="18" rx="3" fill="#244038"/>
    <text x="42" y="13" text-anchor="middle" font-size="11" fill="#e9dcc0" font-family="serif">慈禅甘露堂</text>
  </g>

  <!-- 朝阳 -->
  <circle cx="500" cy="80" r="30" fill="#e8c97a" opacity="0.8"/>
</svg>
